<script type="text/babel">
const{useState,useMemo}=React;
const C={blue:"#2563eb",blueBg:"#eff6ff",pink:"#db2777",pinkBg:"#fdf2f8",green:"#16a34a",greenBg:"#f0fdf4",gold:"#d97706",goldBg:"#fffbeb",gray:"#64748b",grayBg:"#f8fafc",dark:"#1e293b",white:"#fff",border:"#e2e8f0",gradeA:"#7c3aed",gradeABg:"#f5f3ff",gradeB:"#0891b2",gradeBBg:"#ecfeff",court:["#2563eb","#16a34a","#ea580c","#7c3aed"],courtBg:["#eff6ff","#f0fdf4","#fff7ed","#f5f3ff"],ko:"#dc2626",koBg:"#fef2f2"};

const INIT_PA=["Eqi","Anjar","Galih Putra Laksana Adi","Triyono","Andri Muljadi","Rekam","Fadhlan Hussaini"];
const INIT_PB=["Johannes Sigalingging","Aubert Oktaviantono","Ari","Eri Wandri","Rizki Pratama","Herdi Agusthio","Gilang R. Mustadjab","Rio","Asqolani","Baron","Fathan Mustaqim"];
const INIT_W=["Tiffani","Ninik","Fildzah","Cipi","Bela","Endang Kusumah","Utari Purwo","Fitri Ameliasari","Violentine","Ajeng Rachma F.","Aulia Ramadhan","Zahra Maharani","Salsabilla K.","Ayu Santika"];

function shuffle(a){const b=[...a];for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]]}return b}
function genRR(ps,pool,cat){const m=[];for(let i=0;i<ps.length;i++)for(let j=i+1;j<ps.length;j++)m.push({id:`${cat}-${pool}-${i}-${j}`,pool,cat,phase:"group",aLabel:ps[i].label,bLabel:ps[j].label,s1a:null,s1b:null,s2a:null,s2b:null,s3a:null,s3b:null});return m}
function getResult(m){if(!m)return null;const p=v=>parseInt(v),a1=p(m.s1a),b1=p(m.s1b),a2=p(m.s2a),b2=p(m.s2b);if([a1,b1,a2,b2].some(isNaN))return null;let sa=0,sb=0,tp=a1+a2,tq=b1+b2;if(a1>b1)sa++;else sb++;if(a2>b2)sa++;else sb++;if(sa===2)return{winner:"a",sa:2,sb,tpa:tp,tpb:tq};if(sb===2)return{winner:"b",sa,sb:2,tpa:tp,tpb:tq};const a3=p(m.s3a),b3=p(m.s3b);if(isNaN(a3)||isNaN(b3))return null;tp+=a3;tq+=b3;return a3>b3?{winner:"a",sa:2,sb:1,tpa:tp,tpb:tq}:{winner:"b",sa:1,sb:2,tpa:tp,tpb:tq}}
function calcStandings(ts,ms){const s={};ts.forEach(t=>{s[t.label]={label:t.label,played:0,w:0,l:0,sw:0,sl:0,pf:0,pa:0,pts:0}});ms.forEach(m=>{const r=getResult(m);if(!r)return;const a=s[m.aLabel],b=s[m.bLabel];if(!a||!b)return;a.played++;b.played++;a.sw+=r.sa;a.sl+=r.sb;b.sw+=r.sb;b.sl+=r.sa;a.pf+=r.tpa;a.pa+=r.tpb;b.pf+=r.tpb;b.pa+=r.tpa;if(r.winner==="a"){a.w++;a.pts+=2;b.l++;b.pts+=1}else{b.w++;b.pts+=2;a.l++;a.pts+=1}});return Object.values(s).sort((a,b)=>(b.pts-a.pts)||((b.sw-b.sl)-(a.sw-a.sl))||((b.pf-b.pa)-(a.pf-a.pa))||(b.pf-a.pf))}
function need3(m){const v=[m.s1a,m.s1b,m.s2a,m.s2b].map(x=>parseInt(x));if(v.some(isNaN))return false;let a=0,b=0;if(v[0]>v[1])a++;else b++;if(v[2]>v[3])a++;else b++;return a===1&&b===1}

/* ══ SMART SCHEDULER: balance putri+putra per round, fill 4 courts ══ */
function pick(arr,n,used){
  const out=[];
  for(let i=0;i<arr.length&&out.length<n;i++){
    if(!used.has(arr[i].aLabel)&&!used.has(arr[i].bLabel)){
      const m=arr.splice(i,1)[0];out.push(m);used.add(m.aLabel);used.add(m.bLabel);i--;
    }
  }
  return out;
}

function smartSchedule(putri,putra){
  const rW=[...putri],rP=[...putra],rounds=[];
  while(rW.length>0||rP.length>0){
    const rd=[];
    const uW=new Set(),uP=new Set();

    /* putri & putra have separate team namespaces (W vs P) so never conflict
       across categories — only check within each */

    if(rP.length>0&&rW.length>0){
      /* Phase: both available → aim 2W + 2P = 4 */
      const pw=pick(rW,2,uW);
      rd.push(...pw);
      const pp=pick(rP,2,uP);
      rd.push(...pp);
      /* if room left, try to fill */
      if(rd.length<4){const extra=pick(rW,4-rd.length,uW);rd.push(...extra)}
      if(rd.length<4){const extra=pick(rP,4-rd.length,uP);rd.push(...extra)}
    } else if(rW.length>0){
      /* Only putri left → max 3 per round */
      const pw=pick(rW,4,uW);rd.push(...pw);
    } else {
      /* Only putra left → max depends on group sizes */
      const pp=pick(rP,4,uP);rd.push(...pp);
    }
    rounds.push(rd);
  }
  return rounds;
}

/* ── UI helpers ── */
function GBadge({g,s:sm}){return<span style={{display:"inline-block",padding:sm?"0 4px":"1px 6px",borderRadius:4,fontSize:sm?8:10,fontWeight:800,background:g==="A"?C.gradeA:C.gradeB,color:C.white,lineHeight:"16px"}}>{g}</span>}
function CatBadge({cat}){const p=cat==="putra";return<span style={{padding:"1px 7px",borderRadius:99,fontSize:10,fontWeight:700,background:p?C.blueBg:C.pinkBg,color:p?C.blue:C.pink,border:`1px solid ${p?C.blue:C.pink}22`,textTransform:"uppercase",letterSpacing:.4}}>{p?"PA":"PI"}</span>}
function KOBadge(){return<span style={{padding:"1px 6px",borderRadius:99,fontSize:9,fontWeight:800,background:C.koBg,color:C.ko,border:`1px solid ${C.ko}30`}}>KNOCKOUT</span>}
function SI({value,onChange}){return<input type="number" min={0} max={15} value={value!=null?value:""} onChange={e=>onChange(e.target.value===""?null:e.target.value)} style={{width:30,padding:"3px 1px",textAlign:"center",border:`1.5px solid ${C.border}`,borderRadius:5,fontSize:12,fontWeight:700,color:C.dark,outline:"none",background:value!=null?C.goldBg:C.white}} onFocus={e=>{e.target.style.borderColor=C.blue}} onBlur={e=>{e.target.style.borderColor=C.border}}/>}
function SetRow({l,va,vb,onA,onB}){return<div style={{display:"flex",alignItems:"center",gap:2,marginBottom:1}}><span style={{fontSize:8,color:C.gray,width:14,textAlign:"right"}}>{l}</span><SI value={va} onChange={onA}/><span style={{color:C.gray,fontSize:9}}>-</span><SI value={vb} onChange={onB}/></div>}

function CourtCard({m,ci,onScore,getPair}){
  if(!m)return<div style={{flex:"1 1 150px",border:`1.5px dashed ${C.border}`,borderRadius:10,padding:10,textAlign:"center",color:"#cbd5e1",fontSize:11,minHeight:80,display:"flex",alignItems:"center",justifyContent:"center"}}>Lap. {ci+1}</div>;
  const r=getResult(m),done=!!r,aW=r&&r.winner==="a",bW=r&&r.winner==="b",n3=need3(m);
  const pA=getPair(m.aLabel),pB=getPair(m.bLabel),isKO=m.phase==="knockout";
  return(
    <div style={{flex:"1 1 150px",border:`1.5px solid ${done?C.green:isKO?C.ko:C.court[ci]}`,borderRadius:10,padding:"7px 9px",background:done?C.greenBg:isKO?C.koBg:C.courtBg[ci],minWidth:0}}>
      <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:4,gap:3,flexWrap:"wrap"}}>
        <span style={{fontSize:10,fontWeight:800,color:isKO?C.ko:C.court[ci]}}>Lap. {ci+1}</span>
        <div style={{display:"flex",gap:3}}>{isKO&&<KOBadge/>}<CatBadge cat={m.cat}/></div>
      </div>
      {isKO&&m.koLabel&&<div style={{fontSize:9,fontWeight:700,color:C.ko,marginBottom:2}}>{m.koLabel}</div>}
      <div style={{display:"flex",alignItems:"center",gap:3,marginBottom:1}}>
        <span style={{fontSize:11,fontWeight:aW?800:600,color:aW?C.green:C.dark}}>{m.aLabel||"TBD"}</span>
        {aW&&<span style={{fontSize:9,color:C.green}}>✓</span>}
      </div>
      {pA&&<div style={{fontSize:8,color:C.gray,marginBottom:2,lineHeight:1.2}}>{pA.p1} & {pA.p2}</div>}
      <SetRow l="S1" va={m.s1a} vb={m.s1b} onA={v=>onScore(m.id,"s1a",v)} onB={v=>onScore(m.id,"s1b",v)}/>
      <SetRow l="S2" va={m.s2a} vb={m.s2b} onA={v=>onScore(m.id,"s2a",v)} onB={v=>onScore(m.id,"s2b",v)}/>
      {n3&&<SetRow l="S3" va={m.s3a} vb={m.s3b} onA={v=>onScore(m.id,"s3a",v)} onB={v=>onScore(m.id,"s3b",v)}/>}
      <div style={{display:"flex",alignItems:"center",gap:3,marginTop:2}}>
        <span style={{fontSize:11,fontWeight:bW?800:600,color:bW?C.green:C.dark}}>{m.bLabel||"TBD"}</span>
        {bW&&<span style={{fontSize:9,color:C.green}}>✓</span>}
      </div>
      {pB&&<div style={{fontSize:8,color:C.gray,lineHeight:1.2}}>{pB.p1} & {pB.p2}</div>}
    </div>
  );
}

function StTable({title,color,colorBg,teams,matches,pm,showMedal,showQ}){
  const st=calcStandings(teams,matches);const medal=["🥇","🥈","🥉"];
  return(<div style={{border:`1px solid ${C.border}`,borderRadius:10,overflow:"hidden"}}>
    <div style={{background:colorBg,padding:"6px 12px",borderBottom:`1px solid ${C.border}`}}><span style={{fontWeight:700,fontSize:13,color}}>{title}</span></div>
    <div style={{overflowX:"auto"}}><table style={{fontSize:11,minWidth:480}}>
      <thead><tr style={{background:C.grayBg}}>{["#","ID","Pemain","M","W","L","SW","SL","PF","PA","+/-","Pts"].map(h=><th key={h} style={{padding:"5px 3px",textAlign:(h==="ID"||h==="Pemain")?"left":"center",fontWeight:600,color:C.gray,borderBottom:`1px solid ${C.border}`,fontSize:9}}>{h}</th>)}</tr></thead>
      <tbody>{st.map((s,i)=>{const pair=pm?pm[s.label]:null;const isQ=showQ&&i<2&&s.played>0;const isM=showMedal&&i<3&&s.played>0;
        return<tr key={s.label} style={{background:isQ?C.greenBg:isM?C.goldBg:i%2?C.grayBg:"transparent"}}>
          <td style={{padding:"5px 3px",textAlign:"center",fontSize:12}}>{isM?medal[i]:isQ?<span style={{fontSize:9,background:C.green,color:C.white,borderRadius:3,padding:"1px 4px"}}>Q</span>:i+1}</td>
          <td style={{padding:"5px 3px",fontWeight:700,whiteSpace:"nowrap"}}>{s.label}</td>
          <td style={{padding:"5px 3px",fontSize:9,color:C.gray,whiteSpace:"nowrap"}}>{pair?pair.p1+" & "+pair.p2:"-"}</td>
          <td style={{padding:"5px 3px",textAlign:"center"}}>{s.played}</td>
          <td style={{padding:"5px 3px",textAlign:"center",color:C.green,fontWeight:700}}>{s.w}</td>
          <td style={{padding:"5px 3px",textAlign:"center",color:"#dc2626"}}>{s.l}</td>
          <td style={{padding:"5px 3px",textAlign:"center"}}>{s.sw}</td><td style={{padding:"5px 3px",textAlign:"center"}}>{s.sl}</td>
          <td style={{padding:"5px 3px",textAlign:"center"}}>{s.pf}</td><td style={{padding:"5px 3px",textAlign:"center"}}>{s.pa}</td>
          <td style={{padding:"5px 3px",textAlign:"center",fontWeight:600,color:s.pf-s.pa>0?C.green:s.pf-s.pa<0?"#dc2626":C.gray}}>{(s.pf-s.pa>0?"+":"")+(s.pf-s.pa)}</td>
          <td style={{padding:"5px 3px",textAlign:"center",fontWeight:800,fontSize:13}}>{s.pts}</td>
        </tr>})}</tbody>
    </table></div></div>);
}

/* ═══════════ MAIN ═══════════ */
const STEPS=["input","draw","schedule","standings","knockout","rules"];
const SL=["✏️ Pemain","🎲 Kocokan","📋 Jadwal","🏆 Klasemen","⚔️ Knockout","📖 Aturan"];

function App(){
  const[step,setStep]=useState("input");
  const[putraA,setPA]=useState(INIT_PA.map(n=>({name:n})));
  const[putraB,setPB]=useState(INIT_PB.map(n=>({name:n})));
  const[putriList,setWL]=useState(INIT_W.map(n=>({name:n})));
  const[pp,setPP]=useState(null);const[wp,setWP]=useState(null);
  const[pm,setPM]=useState({});const[groups,setGrp]=useState(null);
  const[rounds,setRounds]=useState([]);const[allM,setAllM]=useState([]);
  const[ko,setKo]=useState(null);const[anim,setAnim]=useState(false);

  const upN=(set,i,v)=>set(p=>p.map((x,j)=>j===i?{...x,name:v}:x));
  const moveToB=i=>{const p=putraA[i];setPA(prev=>prev.filter((_,j)=>j!==i));setPB(prev=>[...prev,p])};
  const moveToA=i=>{const p=putraB[i];setPB(prev=>prev.filter((_,j)=>j!==i));setPA(prev=>[...prev,p])};

  const doDraw=()=>{
    if(putraA.length+putraB.length!==18){alert("Total putra harus 18!");return}
    const nA=putraA.length,nB=putraB.length;
    const sA=shuffle([...putraA]),sB=shuffle([...putraB]);
    const minP=Math.min(nA,nB);const pairs=[];
    for(let i=0;i<minP;i++)pairs.push({label:"P"+(i+1),p1:sA[i].name,p2:sB[i].name,g1:"A",g2:"B",idx:i});
    let idx=minP;
    const bigger=nA>nB?sA:sB,bigG=nA>nB?"A":"B";
    for(let i=minP;i+1<(nA>nB?nA:nB);i+=2){pairs.push({label:"P"+(idx+1),p1:bigger[i].name,p2:bigger[i+1].name,g1:bigG,g2:bigG,idx});idx++}
    setPP(pairs);

    const sW=shuffle([...putriList]);const wPairs=[];
    for(let i=0;i<7;i++)wPairs.push({label:"W"+(i+1),p1:sW[i*2].name,p2:sW[i*2+1].name,idx:i});
    setWP(wPairs);

    const pmap={};
    pairs.forEach(p=>{pmap[p.label]={p1:p.p1,p2:p.p2,g1:p.g1,g2:p.g2}});
    wPairs.forEach(p=>{pmap[p.label]={p1:p.p1,p2:p.p2}});
    setPM(pmap);

    const sp=shuffle([...pairs]);
    const grpA=sp.slice(0,5).map(p=>({idx:p.idx,label:p.label}));
    const grpB=sp.slice(5).map(p=>({idx:p.idx,label:p.label}));
    const allW=shuffle([...wPairs]).map(p=>({idx:p.idx,label:p.label}));
    setGrp({putraA:grpA,putraB:grpB,putri:allW});

    const mPA=genRR(grpA,"A","putra"),mPB=genRR(grpB,"B","putra"),mW=genRR(allW,"RR","putri");

    // Reserve 4 putri for KO interleave
    const wPool=[...mW];
    const koW1=pick(wPool,2,new Set());
    const koW2=pick(wPool,2,new Set());

    // SMART schedule: balanced 2W+2P per round
    const groupRds=smartSchedule(wPool,[...mPA,...mPB]);

    // Balance day split by match count
    let totalG=0;groupRds.forEach(r=>totalG+=r.length);
    const targetD1=Math.ceil(totalG/2);
    let cumul=0,splitIdx=0;
    for(let i=0;i<groupRds.length;i++){cumul+=groupRds[i].length;if(cumul>=targetD1){splitIdx=i+1;break}}

    const day1Rds=groupRds.slice(0,splitIdx);
    const day2Rds=groupRds.slice(splitIdx);

    // KO templates
    const eko=()=>({s1a:null,s1b:null,s2a:null,s2b:null,s3a:null,s3b:null});
    const sf1={id:"ko-sf1",cat:"putra",pool:"KO",phase:"knockout",koLabel:"Semifinal 1",aLabel:"",bLabel:"",...eko()};
    const sf2={id:"ko-sf2",cat:"putra",pool:"KO",phase:"knockout",koLabel:"Semifinal 2",aLabel:"",bLabel:"",...eko()};
    const k3={id:"ko-3rd",cat:"putra",pool:"KO",phase:"knockout",koLabel:"Perebutan Juara 3",aLabel:"",bLabel:"",...eko()};
    const kf={id:"ko-fin",cat:"putra",pool:"KO",phase:"knockout",koLabel:"🏆 FINAL",aLabel:"",bLabel:"",...eko()};
    setKo({sf1,sf2,third:k3,final:kf});

    // Assemble rounds
    let no=1;const coll=[];
    const tag=(rds,day)=>rds.map(rd=>({slots:rd.map(m=>{const o={...m,no:no++,day};coll.push(o);return o}),day}));
    const tagKO=(slots,day)=>({slots:slots.map(m=>{const o={...m,no:no++,day};coll.push(o);return o}),day,isKO:true});

    const r1=tag(day1Rds,1);
    const r2=tag(day2Rds,2);
    const kr1=tagKO([sf1,sf2,...koW1],2);
    const kr2=tagKO([k3,kf,...koW2],2);

    setRounds([...r1,...r2,kr1,kr2]);
    setAllM(coll);
    setAnim(true);setStep("draw");setTimeout(()=>setAnim(false),2000);
  };

  const reDraw=()=>{if(confirm("Acak ulang? Semua skor direset."))doDraw()};
  const hScore=(id,f,v)=>{
    setAllM(p=>p.map(m=>m.id===id?{...m,[f]:v}:m));
    setRounds(p=>p.map(r=>({...r,slots:r.slots.map(m=>m.id===id?{...m,[f]:v}:m)})));
    if(id.startsWith("ko-"))setKo(p=>{const n={...p};for(const k in n)if(n[k]&&n[k].id===id)n[k]={...n[k],[f]:v};return n});
  };
  const getPair=label=>pm[label]||null;
  const grpM=useMemo(()=>allM.filter(m=>m.phase==="group"),[allM]);
  const stA=useMemo(()=>groups?calcStandings(groups.putraA,grpM.filter(m=>m.cat==="putra"&&m.pool==="A")):[],[groups,grpM]);
  const stB=useMemo(()=>groups?calcStandings(groups.putraB,grpM.filter(m=>m.cat==="putra"&&m.pool==="B")):[],[groups,grpM]);
  const pDone=useMemo(()=>{const pm2=grpM.filter(m=>m.cat==="putra");return pm2.length>0&&pm2.every(m=>getResult(m)!==null)},[grpM]);

  const koV=useMemo(()=>{
    if(!ko)return null;if(!pDone||stA.length<2||stB.length<2)return ko;
    const n={...ko};
    n.sf1={...n.sf1,aLabel:stA[0].label,bLabel:stB[1].label};
    n.sf2={...n.sf2,aLabel:stB[0].label,bLabel:stA[1].label};
    const r1=getResult(n.sf1),r2=getResult(n.sf2);
    if(r1&&r2){n.third={...n.third,aLabel:r1.winner==="a"?n.sf1.bLabel:n.sf1.aLabel,bLabel:r2.winner==="a"?n.sf2.bLabel:n.sf2.aLabel};n.final={...n.final,aLabel:r1.winner==="a"?n.sf1.aLabel:n.sf1.bLabel,bLabel:r2.winner==="a"?n.sf2.aLabel:n.sf2.bLabel}}
    else{n.third={...n.third,aLabel:"",bLabel:""};n.final={...n.final,aLabel:"",bLabel:""};}
    return n;
  },[ko,pDone,stA,stB]);

  const dispRounds=useMemo(()=>{
    if(!koV)return rounds;
    return rounds.map(r=>{if(!r.isKO)return r;
      return{...r,slots:r.slots.map(m=>{
        if(m.id==="ko-sf1")return{...m,...koV.sf1};if(m.id==="ko-sf2")return{...m,...koV.sf2};
        if(m.id==="ko-3rd")return{...m,...koV.third};if(m.id==="ko-fin")return{...m,...koV.final};return m;
      })};
    });
  },[rounds,koV]);

  const filled=grpM.filter(m=>getResult(m)).length;const totalGrp=grpM.length;

  return(
    <div style={{maxWidth:780,margin:"0 auto",padding:"20px 10px",color:C.dark}}>
      <div style={{textAlign:"center",marginBottom:14}}>
        <h1 style={{fontSize:20,fontWeight:800,margin:0}}>🏸 Liga Badminton</h1>
        <p style={{fontSize:11,color:C.gray,margin:"3px 0"}}>4 Lapangan • 2×11 Rally Point • 20:00–22:00</p>
      </div>
      <div style={{display:"flex",gap:2,marginBottom:14,background:"#f1f5f9",borderRadius:9,padding:3,overflowX:"auto"}}>
        {STEPS.map((s,i)=>{const off=!pp&&i>0;return<button key={s} onClick={()=>!off&&setStep(s)} style={{flex:"1 0 auto",padding:"6px 3px",border:"none",borderRadius:7,cursor:off?"default":"pointer",fontSize:10,fontWeight:step===s?700:500,background:step===s?C.white:"transparent",color:off?"#cbd5e1":step===s?C.dark:C.gray,boxShadow:step===s?"0 1px 3px rgba(0,0,0,0.07)":"none",whiteSpace:"nowrap"}}>{SL[i]}</button>})}
      </div>

      {/* ─── INPUT ─── */}
      {step==="input"&&<div>
        <div style={{background:C.goldBg,border:`1px solid ${C.gold}30`,borderRadius:9,padding:"8px 12px",marginBottom:14,fontSize:12}}>
          💡 Klik <strong>→B</strong> / <strong>A←</strong> untuk pindah grade. A dipasangkan acak dengan B, sisa sesama grade.
        </div>
        <h3 style={{fontSize:14,margin:"0 0 8px",color:C.blue}}>🔵 Ganda Putra — {putraA.length+putraB.length} Pemain</h3>
        <div style={{display:"flex",gap:8,flexWrap:"wrap",marginBottom:6}}>
          <div style={{flex:"1 1 240px"}}>
            <div style={{fontSize:11,fontWeight:700,color:C.gradeA,marginBottom:4}}><GBadge g="A"/> Grade A ({putraA.length})</div>
            <div style={{display:"flex",flexDirection:"column",gap:3}}>
              {putraA.map((p,i)=><div key={i} style={{display:"flex",alignItems:"center",gap:4,padding:"4px 6px",borderRadius:7,background:C.gradeABg,border:`1px solid ${C.border}`}}>
                <GBadge g="A" s/>
                <input type="text" value={p.name} onChange={e=>upN(setPA,i,e.target.value)} style={{flex:1,border:`1px solid ${C.border}`,borderRadius:5,padding:"4px 6px",fontSize:12,outline:"none",minWidth:0,background:C.white}}/>
                <button className="sb" onClick={()=>moveToB(i)} style={{background:C.gradeB,color:C.white}}>→B</button>
              </div>)}
            </div>
          </div>
          <div style={{flex:"1 1 240px"}}>
            <div style={{fontSize:11,fontWeight:700,color:C.gradeB,marginBottom:4}}><GBadge g="B"/> Grade B ({putraB.length})</div>
            <div style={{display:"flex",flexDirection:"column",gap:3}}>
              {putraB.map((p,i)=><div key={i} style={{display:"flex",alignItems:"center",gap:4,padding:"4px 6px",borderRadius:7,background:C.gradeBBg,border:`1px solid ${C.border}`}}>
                <button className="sb" onClick={()=>moveToA(i)} style={{background:C.gradeA,color:C.white}}>A←</button>
                <GBadge g="B" s/>
                <input type="text" value={p.name} onChange={e=>upN(setPB,i,e.target.value)} style={{flex:1,border:`1px solid ${C.border}`,borderRadius:5,padding:"4px 6px",fontSize:12,outline:"none",minWidth:0,background:C.white}}/>
              </div>)}
            </div>
          </div>
        </div>
        <div style={{fontSize:11,color:C.gray,marginBottom:14,textAlign:"center"}}>
          Pair A+B: <strong>{Math.min(putraA.length,putraB.length)}</strong> &nbsp;|&nbsp;
          Pair {putraA.length>=putraB.length?"A+A":"B+B"}: <strong>{Math.floor(Math.abs(putraA.length-putraB.length)/2)}</strong> &nbsp;|&nbsp;
          Total: <strong>{Math.min(putraA.length,putraB.length)+Math.floor(Math.abs(putraA.length-putraB.length)/2)}</strong> pasang
          {(putraA.length+putraB.length)%2!==0&&<span style={{color:C.ko}}> ⚠️ Total ganjil!</span>}
        </div>

        <h3 style={{fontSize:14,margin:"0 0 8px",color:C.pink}}>🔴 Ganda Putri — 14 Pemain</h3>
        <div style={{display:"flex",gap:8,flexWrap:"wrap",marginBottom:18}}>
          {[0,7].map(s=><div key={s} style={{flex:"1 1 240px"}}><div style={{display:"flex",flexDirection:"column",gap:3}}>
            {putriList.slice(s,s+7).map((p,i)=><div key={s+i} style={{display:"flex",alignItems:"center",gap:6,padding:"5px 8px",borderRadius:7,background:C.pinkBg,border:`1px solid ${C.border}`}}>
              <span style={{width:20,height:20,borderRadius:"50%",background:C.pink,color:C.white,display:"flex",alignItems:"center",justifyContent:"center",fontSize:9,fontWeight:800,flexShrink:0}}>{s+i+1}</span>
              <input type="text" value={p.name} onChange={e=>upN(setWL,s+i,e.target.value)} style={{flex:1,border:`1px solid ${C.border}`,borderRadius:5,padding:"4px 6px",fontSize:12,outline:"none",minWidth:0,background:C.white}}/>
            </div>)}
          </div></div>)}
        </div>
        <button onClick={doDraw} style={{width:"100%",padding:"13px",border:"none",borderRadius:11,background:`linear-gradient(135deg,${C.gradeA},${C.pink})`,color:C.white,fontSize:15,fontWeight:800,cursor:"pointer",boxShadow:"0 4px 14px rgba(124,58,237,0.25)"}}>🎲 MULAI KOCOKAN</button>
      </div>}

      {/* ─── DRAW ─── */}
      {step==="draw"&&pp&&wp&&groups&&<div>
        <div style={{display:"flex",gap:6,marginBottom:14,flexWrap:"wrap"}}>
          <button onClick={()=>setStep("input")} style={{flex:1,padding:"7px",border:`1px solid ${C.border}`,borderRadius:7,background:C.white,cursor:"pointer",fontSize:11,fontWeight:600}}>✏️ Edit</button>
          <button onClick={reDraw} style={{flex:1,padding:"7px",border:"none",borderRadius:7,background:C.gradeA,color:C.white,cursor:"pointer",fontSize:11,fontWeight:700}}>🎲 Acak Ulang</button>
          <button onClick={()=>setStep("schedule")} style={{flex:1,padding:"7px",border:"none",borderRadius:7,background:C.green,color:C.white,cursor:"pointer",fontSize:11,fontWeight:700}}>📋 Jadwal →</button>
        </div>
        <h3 style={{fontSize:14,margin:"0 0 8px",color:C.blue}}>🔵 Ganda Putra — {pp.length} Pasang</h3>
        {[{k:"putraA",n:"Grup A ("+groups.putraA.length+")"},{k:"putraB",n:"Grup B ("+groups.putraB.length+")"}].map(s=><div key={s.k} style={{marginBottom:12}}>
          <span style={{fontSize:11,fontWeight:700,color:C.blue,background:C.blueBg,padding:"3px 8px",borderRadius:5,display:"inline-block",marginBottom:6}}>{s.n}</span>
          <div style={{display:"flex",flexDirection:"column",gap:5}}>
            {groups[s.k].map(slot=>{const pair=pp[slot.idx];return<div key={slot.idx} style={{display:"flex",alignItems:"center",gap:6,padding:"7px 10px",borderRadius:8,border:`1px solid ${C.border}`,background:C.white,animation:anim?`fadeUp 0.35s ease ${slot.idx*0.07}s both`:"none",flexWrap:"wrap"}}>
              <span style={{fontWeight:800,fontSize:13,color:C.blue,width:26}}>{pair.label}</span>
              <GBadge g={pair.g1} s/><span style={{fontSize:12,fontWeight:600}}>{pair.p1}</span>
              <span style={{color:C.gray,fontSize:11}}>🤝</span>
              <GBadge g={pair.g2} s/><span style={{fontSize:12,fontWeight:600}}>{pair.p2}</span>
            </div>})}
          </div>
        </div>)}
        <h3 style={{fontSize:14,margin:"16px 0 8px",color:C.pink}}>🔴 Ganda Putri — 7 Pasang</h3>
        <div style={{display:"flex",flexDirection:"column",gap:5,marginBottom:14}}>
          {wp.map(pair=><div key={pair.idx} style={{display:"flex",alignItems:"center",gap:6,padding:"7px 10px",borderRadius:8,border:`1px solid ${C.border}`,background:C.white,animation:anim?`fadeUp 0.35s ease ${pair.idx*0.07}s both`:"none"}}>
            <span style={{fontWeight:800,fontSize:13,color:C.pink,width:26}}>{pair.label}</span>
            <span style={{fontSize:12,fontWeight:600}}>{pair.p1}</span><span style={{color:C.gray,fontSize:11}}>🤝</span><span style={{fontSize:12,fontWeight:600}}>{pair.p2}</span>
          </div>)}
        </div>
        <div style={{background:C.blueBg,borderRadius:9,padding:"10px 14px",fontSize:12,border:`1px solid ${C.blue}20`}}>
          ℹ️ <strong>Putra:</strong> 2 Grup → round-robin → SF → Final (🏆 1-2-3)<br/>
          <strong>Putri:</strong> Full round-robin → 🏆 1-2-3 dari klasemen<br/>
          <strong>Jadwal:</strong> Balanced 2 putri + 2 putra per ronde • KO diselingi putri
        </div>
      </div>}

      {/* ─── SCHEDULE ─── */}
      {step==="schedule"&&dispRounds.length>0&&<div>
        <div style={{display:"flex",gap:6,marginBottom:10,flexWrap:"wrap"}}>
          {[{v:totalGrp,l:"Grup"},{v:"4",l:"Knockout"},{v:"4",l:"Lapangan"},{v:filled+"/"+totalGrp,l:"Selesai"}].map((c,i)=>
            <div key={i} style={{flex:"1 1 55px",background:C.grayBg,border:`1px solid ${C.border}`,borderRadius:7,padding:"4px",textAlign:"center"}}>
              <div style={{fontSize:14,fontWeight:800}}>{c.v}</div><div style={{fontSize:8,color:C.gray}}>{c.l}</div>
            </div>)}
        </div>
        <div style={{display:"flex",gap:6,marginBottom:14,fontSize:10,color:C.gray,flexWrap:"wrap"}}>
          {[["Putra",C.blueBg,C.blue],["Putri",C.pinkBg,C.pink],["Knockout",C.koBg,C.ko],["Selesai",C.greenBg,C.green]].map(([l,bg,bd])=>
            <div key={l} style={{display:"flex",alignItems:"center",gap:3}}><span style={{width:10,height:10,borderRadius:3,background:bg,border:`1px solid ${bd}40`}}/>{l}</div>)}
        </div>

        {[1,2].map(day=>{
          const dr=dispRounds.filter(r=>r.day===day);if(!dr.length)return null;
          return<div key={day} style={{marginBottom:20}}>
            <div style={{background:day===1?C.blueBg:C.pinkBg,border:`1px solid ${(day===1?C.blue:C.pink)}20`,borderRadius:9,padding:"8px 12px",marginBottom:10,fontSize:13,fontWeight:700}}>
              📅 Hari {day} <span style={{fontSize:11,fontWeight:400,color:C.gray}}>20:00–22:00 • {dr.length} ronde • {dr.reduce((s,r)=>s+r.slots.length,0)} match{dr.some(r=>r.isKO)?" (incl. knockout)":""}</span>
            </div>
            {dr.map((r,ri)=>{
              const t=20*60+ri*20;
              const ts=String(Math.floor(t/60)).padStart(2,"0")+":"+String(t%60).padStart(2,"0");
              return<div key={ri} style={{marginBottom:12}}>
                <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:5}}>
                  <span style={{fontSize:11,fontWeight:800,color:r.isKO?C.ko:C.dark}}>{r.isKO?"⚔️ Knockout":"Ronde "+(ri+1)}</span>
                  <span style={{fontSize:10,color:C.gray,fontFamily:"monospace"}}>⏱ {ts}</span>
                  <div style={{flex:1,borderBottom:`1px dashed ${r.isKO?C.ko+"40":C.border}`}}/>
                  <span style={{fontSize:9,color:C.gray}}>{r.slots.length}/4 lap</span>
                </div>
                <div style={{display:"flex",gap:5,flexWrap:"wrap"}}>
                  {[0,1,2,3].map(ci=><CourtCard key={ci} m={r.slots[ci]||null} ci={ci} onScore={hScore} getPair={getPair}/>)}
                </div>
              </div>})}
          </div>})}
        {pDone&&<div style={{background:C.greenBg,border:`1px solid ${C.green}30`,borderRadius:9,padding:"8px 12px",fontSize:12,textAlign:"center"}}>✅ Grup putra selesai! Buka <strong>⚔️ Knockout</strong>.</div>}
      </div>}

      {/* ─── STANDINGS ─── */}
      {step==="standings"&&groups&&<div>
        {filled===0&&<div style={{background:C.goldBg,border:`1px solid ${C.gold}30`,borderRadius:9,padding:"8px 12px",marginBottom:14,fontSize:12,textAlign:"center"}}>⚡ Input skor di <strong>Jadwal</strong> — klasemen auto terupdate!</div>}
        <h3 style={{fontSize:14,margin:"0 0 8px",color:C.blue}}>🔵 Ganda Putra — Fase Grup</h3>
        <p style={{fontSize:11,color:C.gray,marginBottom:8}}>2 teratas (<span style={{background:C.greenBg,padding:"0 4px",borderRadius:3}}>Q</span>) lolos semifinal</p>
        <div style={{display:"flex",flexDirection:"column",gap:8,marginBottom:18}}>
          <StTable title={"Grup A ("+groups.putraA.length+")"} color={C.blue} colorBg={C.blueBg} teams={groups.putraA} matches={grpM.filter(m=>m.cat==="putra"&&m.pool==="A")} pm={pm} showQ/>
          <StTable title={"Grup B ("+groups.putraB.length+")"} color={C.blue} colorBg={C.blueBg} teams={groups.putraB} matches={grpM.filter(m=>m.cat==="putra"&&m.pool==="B")} pm={pm} showQ/>
        </div>
        <h3 style={{fontSize:14,margin:"0 0 8px",color:C.pink}}>🔴 Ganda Putri — Full Round Robin</h3>
        <StTable title="Klasemen Putri (7 pasang • 21 match)" color={C.pink} colorBg={C.pinkBg} teams={groups.putri} matches={grpM.filter(m=>m.cat==="putri")} pm={pm} showMedal/>
        <div style={{marginTop:8,fontSize:11,color:C.gray,textAlign:"center"}}>🏅 Juara 1-2-3 putri dari klasemen</div>
      </div>}

      {/* ─── KNOCKOUT ─── */}
      {step==="knockout"&&<div>
        <h3 style={{fontSize:14,margin:"0 0 10px",color:C.blue}}>⚔️ Knockout Ganda Putra</h3>
        {!pDone&&<div style={{background:C.goldBg,border:`1px solid ${C.gold}30`,borderRadius:9,padding:"10px 14px",fontSize:12}}>⏳ Selesaikan grup putra di <strong>Jadwal</strong>.</div>}
        {pDone&&koV&&<div>
          <div style={{background:C.blueBg,borderRadius:9,padding:"8px 12px",marginBottom:14,fontSize:11,border:`1px solid ${C.blue}20`}}>
            <strong>SF1:</strong> {stA[0]?.label} vs {stB[1]?.label} &nbsp;|&nbsp; <strong>SF2:</strong> {stB[0]?.label} vs {stA[1]?.label}
          </div>
          {[["sf1","🔵 Semifinal 1",C.blue],["sf2","🔵 Semifinal 2",C.blue],["third","🥉 Juara 3",C.gray],["final","🏆 FINAL","#f59e0b"]].map(([k,label,accent])=>{
            const m=koV[k];if(!m)return null;const r=getResult(m),aW=r&&r.winner==="a",bW=r&&r.winner==="b",n3m=need3(m),isFin=k==="final";
            const pA=getPair(m.aLabel),pB=getPair(m.bLabel);
            return<div key={k} style={{border:`2px solid ${isFin?"#f59e0b":accent}`,borderRadius:12,padding:"10px 14px",background:isFin?"linear-gradient(135deg,#fef3c7,#fde68a)":r?C.greenBg:C.white,marginBottom:10}}>
              <div style={{fontSize:11,fontWeight:800,color:isFin?"#92400e":accent,marginBottom:6}}>{label}</div>
              {(!m.aLabel&&!m.bLabel)?<div style={{color:"#cbd5e1",fontSize:12}}>Menunggu hasil SF...</div>:<div>
                <div style={{display:"flex",alignItems:"center",gap:4,marginBottom:1}}><span style={{fontSize:13,fontWeight:aW?800:600,color:aW?C.green:C.dark}}>{m.aLabel}</span>{aW&&<span style={{fontSize:10,color:C.green}}>✓</span>}{pA&&<span style={{fontSize:9,color:C.gray,marginLeft:4}}>{pA.p1} & {pA.p2}</span>}</div>
                <SetRow l="S1" va={m.s1a} vb={m.s1b} onA={v=>hScore(m.id,"s1a",v)} onB={v=>hScore(m.id,"s1b",v)}/>
                <SetRow l="S2" va={m.s2a} vb={m.s2b} onA={v=>hScore(m.id,"s2a",v)} onB={v=>hScore(m.id,"s2b",v)}/>
                {n3m&&<SetRow l="S3" va={m.s3a} vb={m.s3b} onA={v=>hScore(m.id,"s3a",v)} onB={v=>hScore(m.id,"s3b",v)}/>}
                <div style={{display:"flex",alignItems:"center",gap:4,marginTop:3}}><span style={{fontSize:13,fontWeight:bW?800:600,color:bW?C.green:C.dark}}>{m.bLabel}</span>{bW&&<span style={{fontSize:10,color:C.green}}>✓</span>}{pB&&<span style={{fontSize:9,color:C.gray,marginLeft:4}}>{pB.p1} & {pB.p2}</span>}</div>
              </div>}
            </div>})}
          {(()=>{const rf=getResult(koV.final),r3=getResult(koV.third);if(!rf||!r3)return null;
            const j1=rf.winner==="a"?koV.final.aLabel:koV.final.bLabel,j2=rf.winner==="a"?koV.final.bLabel:koV.final.aLabel,j3=r3.winner==="a"?koV.third.aLabel:koV.third.bLabel;
            return<div style={{marginTop:12,background:"linear-gradient(135deg,#fef3c7,#fde68a)",borderRadius:12,padding:"16px 20px",border:"2px solid #f59e0b",textAlign:"center"}}>
              <div style={{fontSize:16,fontWeight:800,color:"#92400e",marginBottom:8}}>🏆 Hasil Akhir Putra</div>
              {[[j1,"🥇 Juara 1"],[j2,"🥈 Juara 2"],[j3,"🥉 Juara 3"]].map(([l,t])=>{const pr=getPair(l);return<div key={t} style={{marginBottom:3,fontSize:13}}><strong>{t}:</strong> {l}{pr?" — "+pr.p1+" & "+pr.p2:""}</div>})}
            </div>})()}
        </div>}
      </div>}

      {/* ─── RULES ─── */}
      {step==="rules"&&<div style={{fontSize:13,lineHeight:1.7}}>
        <div style={{background:C.goldBg,border:`1px solid ${C.gold}30`,borderRadius:10,padding:"14px 16px",marginBottom:14}}>
          <h3 style={{margin:"0 0 6px",fontSize:15,color:C.gold}}>⚙️ Poin</h3>
          <div style={{display:"flex",gap:14,flexWrap:"wrap"}}>
            {[{v:"2",l:"MENANG",c:C.green},{v:"1",l:"KALAH",c:"#dc2626"},{v:"0",l:"WO",c:C.gray}].map((x,i)=>
              <div key={i} style={{textAlign:"center",flex:"1 1 60px"}}><div style={{fontSize:26,fontWeight:800,color:x.c}}>{x.v}</div><div style={{fontSize:10,color:C.gray}}>poin {x.l}</div></div>)}
          </div>
        </div>
        {[
          {t:"📏 Match 2×11",bg:C.grayBg,bd:C.gray,items:[["Format","Best of 3 set ke 11"],["Rubber","Set 3 jika 1-1"],["Deuce","10-10 → unggul 2, cap 15"]]},
          {t:"🔵 Putra",bg:C.blueBg,bd:C.blue,items:[["Grup","A(5) & B(4) round-robin"],["SF","Juara A vs RU B, Juara B vs RU A"],["Final","+ Perebutan Juara 3"]]},
          {t:"🔴 Putri",bg:C.pinkBg,bd:C.pink,items:[["Format","Full round-robin 21 match"],["Juara","1-2-3 dari klasemen"]]},
          {t:"📅 Jadwal",bg:C.grayBg,bd:C.gray,items:[["Waktu","20:00–22:00, 2 hari"],["Distribusi","~2 putri + 2 putra per ronde (4 lap penuh)"],["KO","Diselingi putri supaya ada jeda"]]},
          {t:"🏅 Tiebreaker",bg:C.grayBg,bd:C.gray,items:[["1.","Poin"],["2.","Selisih set"],["3.","Selisih poin"],["4.","Head-to-head"]]},
        ].map(sec=><div key={sec.t} style={{background:sec.bg,borderRadius:10,padding:"12px 16px",marginBottom:12,border:`1px solid ${sec.bd}18`}}>
          <h3 style={{margin:"0 0 8px",fontSize:14}}>{sec.t}</h3>
          {sec.items.map(([k,v],i)=><p key={i} style={{margin:"0 0 4px"}}><strong>{k}</strong> — {v}</p>)}
        </div>)}
      </div>}

      <div style={{marginTop:18,paddingTop:10,borderTop:`1px solid ${C.border}`,fontSize:10,color:C.gray,textAlign:"center"}}>Liga Badminton • 4 Lap • 2 Hari (20–22) • 2×11 • {totalGrp} Grup + 4 KO</div>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
